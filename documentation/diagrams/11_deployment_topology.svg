<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1000" height="500" fill="#f8fafc" />
  <text x="50" y="40" font-size="20" font-weight="700" fill="#0f172a">Figure 11: Production Deployment &amp; Container Topology</text>
  <text x="50" y="65" font-size="13" fill="#64748b">Bluehost VPS Dedicated Host (50.6.230.198), Docker Network, Nginx Reverse Proxy, Go Backend, MySQL &amp; Redis</text>

  <!-- External User -->
  <g transform="translate(50, 150)">
    <rect width="160" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <text x="80" y="35" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">INTERNET USERS</text>
    <text x="80" y="60" font-size="10" fill="#64748b" text-anchor="middle">Browser / Mobile</text>
    <text x="80" y="80" font-size="10" fill="#0284c7" text-anchor="middle">https://erp.pixandco.lk</text>
    <text x="80" y="100" font-size="9" fill="#16a34a" text-anchor="middle">TLS 1.3 Encrypted</text>
  </g>

  <!-- Arrow -->
  <path d="M 210 210 L 260 210" stroke="#0284c7" stroke-width="2" />
  <polygon points="260,206 268,210 260,214" fill="#0284c7" />

  <!-- VPS Server -->
  <g transform="translate(270, 90)">
    <rect width="680" height="370" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <rect width="680" height="36" rx="12" fill="#eff6ff" />
    <text x="20" y="24" font-size="13" font-weight="700" fill="#1e40af">DEDICATED VPS HOST: server-869369.pixandco.lk (IP: 50.6.230.198)</text>

    <!-- Nginx Host Proxy -->
    <g transform="translate(20, 50)">
      <rect width="160" height="290" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="80" y="25" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">HOST NGINX / SSL</text>
      <text x="15" y="55" font-size="9" fill="#64748b">• Certbot SSL Auto-Renew</text>
      <text x="15" y="75" font-size="9" fill="#64748b">• HTTP/2 + Gzip Enabled</text>
      <text x="15" y="95" font-size="9" fill="#64748b">• Root Domain: proxy to 8081</text>
      <text x="15" y="115" font-size="9" fill="#64748b">• /api/*: proxy to 8080</text>
      <text x="15" y="135" font-size="9" fill="#64748b">• Client Max Body: 50MB</text>
      <text x="15" y="155" font-size="9" fill="#64748b">• X-Forwarded-For IP pass</text>
      <text x="15" y="175" font-size="9" fill="#64748b">• DDoS Rate Limit Guard</text>
    </g>

    <!-- Docker Network Boundary -->
    <g transform="translate(200, 50)">
      <rect width="460" height="290" rx="8" fill="#f0fdf4" stroke="#86efac" />
      <text x="15" y="22" font-size="11" font-weight="700" fill="#166534">DOCKER BRIDGE NETWORK: pharma-erp-network</text>

      <!-- Container 1: Frontend -->
      <g transform="translate(15, 40)">
        <rect width="200" height="100" rx="6" fill="#ffffff" stroke="#bbf7d0" />
        <text x="12" y="20" font-size="10" font-weight="700" fill="#166534">pharma-erp-frontend</text>
        <text x="12" y="38" font-size="8.5" fill="#15803d">• Image: nginx:alpine</text>
        <text x="12" y="52" font-size="8.5" fill="#15803d">• Internal Port: 8081:80</text>
        <text x="12" y="66" font-size="8.5" fill="#15803d">• Serves Vite React 19 SPA</text>
        <text x="12" y="80" font-size="8.5" fill="#15803d">• HTML5 SPA History Routing</text>
      </g>

      <!-- Container 2: Backend -->
      <g transform="translate(235, 40)">
        <rect width="210" height="100" rx="6" fill="#ffffff" stroke="#bbf7d0" />
        <text x="12" y="20" font-size="10" font-weight="700" fill="#166534">pharma-erp-backend</text>
        <text x="12" y="38" font-size="8.5" fill="#15803d">• Binary: Go 1.23 Gin API</text>
        <text x="12" y="52" font-size="8.5" fill="#15803d">• Port: 127.0.0.1:8080</text>
        <text x="12" y="66" font-size="8.5" fill="#15803d">• GORM connection pooling</text>
        <text x="12" y="80" font-size="8.5" fill="#15803d">• Health check: /healthz</text>
      </g>

      <!-- Container 3: Redis -->
      <g transform="translate(15, 160)">
        <rect width="200" height="100" rx="6" fill="#ffffff" stroke="#bbf7d0" />
        <text x="12" y="20" font-size="10" font-weight="700" fill="#166534">pharma-erp-redis</text>
        <text x="12" y="38" font-size="8.5" fill="#15803d">• Image: redis:7-alpine</text>
        <text x="12" y="52" font-size="8.5" fill="#15803d">• Port: 6379 (Isolated)</text>
        <text x="12" y="66" font-size="8.5" fill="#15803d">• Token blacklist &amp; caching</text>
        <text x="12" y="80" font-size="8.5" fill="#15803d">• AOF Persistence enabled</text>
      </g>

      <!-- Container 4: MySQL -->
      <g transform="translate(235, 160)">
        <rect width="210" height="100" rx="6" fill="#ffffff" stroke="#bbf7d0" />
        <text x="12" y="20" font-size="10" font-weight="700" fill="#166534">shared-mysql</text>
        <text x="12" y="38" font-size="8.5" fill="#15803d">• MySQL 8.0 Enterprise</text>
        <text x="12" y="52" font-size="8.5" fill="#15803d">• Port: 3306 (Internal host)</text>
        <text x="12" y="66" font-size="8.5" fill="#15803d">• Storage: NVMe Volume mount</text>
        <text x="12" y="80" font-size="8.5" fill="#15803d">• Nightly automated backup</text>
      </g>
    </g>
  </g>
</svg>