<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1000" height="500" fill="#f8fafc" />
  <text x="50" y="40" font-size="20" font-weight="700" fill="#0f172a">Figure 5: Authentication &amp; JWT Multi-Module Claims Flow</text>
  <text x="50" y="65" font-size="13" fill="#64748b">Login Credential Validation, Multi-Module Scoping, Redis Revocation &amp; In-Memory Claims Context</text>

  <!-- Flow Steps -->
  <g transform="translate(50, 100)">
    <!-- 1: Login Request -->
    <rect width="180" height="340" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <rect width="180" height="35" rx="8" fill="#eff6ff" />
    <text x="15" y="23" font-size="11" font-weight="700" fill="#1e40af">1. CLIENT LOGIN</text>

    <g transform="translate(15, 55)" font-size="10">
      <rect width="150" height="55" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="10" y="20" font-weight="600" fill="#334155">Credentials POST</text>
      <text x="10" y="34" fill="#64748b">/api/v1/auth/login</text>
      <text x="10" y="48" fill="#64748b">{ username, password }</text>

      <rect y="70" width="150" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="10" y="90" font-weight="600" fill="#334155">Tenant Context</text>
      <text x="10" y="104" fill="#64748b">Resolve company_id</text>
      <text x="10" y="118" fill="#64748b">Verify tenant active</text>

      <rect y="150" width="150" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="10" y="170" font-weight="600" fill="#334155">Bcrypt Password</text>
      <text x="10" y="184" fill="#64748b">bcrypt.CompareHash</text>
      <text x="10" y="198" fill="#64748b">Verify salted hash</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 235 270 L 275 270" stroke="#0284c7" stroke-width="2" />
  <polygon points="275,266 283,270 275,274" fill="#0284c7" />

  <!-- 2: JWT Generation -->
  <g transform="translate(285, 100)">
    <rect width="220" height="340" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <rect width="220" height="35" rx="8" fill="#ecfdf5" />
    <text x="15" y="23" font-size="11" font-weight="700" fill="#065f46">2. JWT CLAIMS ENRICHMENT</text>

    <g transform="translate(15, 50)" font-size="9.5">
      <rect width="190" height="150" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="10" y="20" font-weight="700" fill="#166534">JWT Payload Structure</text>
      <text x="10" y="38" font-family="monospace" fill="#15803d">{</text>
      <text x="20" y="52" font-family="monospace" fill="#15803d">"sub": "usr_9981",</text>
      <text x="20" y="66" font-family="monospace" fill="#15803d">"company_id": 2,</text>
      <text x="20" y="80" font-family="monospace" fill="#15803d">"branch_id": 2,</text>
      <text x="20" y="94" font-family="monospace" fill="#15803d">"role_id": 1,</text>
      <text x="20" y="108" font-family="monospace" fill="#15803d">"modules": [1,2,3,4,5],</text>
      <text x="20" y="122" font-family="monospace" fill="#15803d">"exp": 1792080000</text>
      <text x="10" y="138" font-family="monospace" fill="#15803d">}</text>

      <rect y="165" width="190" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="10" y="185" font-weight="600" fill="#1e40af">HMAC-SHA256 Signature</text>
      <text x="10" y="200" font-size="8.5" fill="#3b82f6">Signed with isolated secret:</text>
      <text x="10" y="212" font-size="8.5" fill="#3b82f6">`JWT_SECRET` (Tenant vs Platform)</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 510 270 L 550 270" stroke="#059669" stroke-width="2" />
  <polygon points="550,266 558,270 550,274" fill="#059669" />

  <!-- 3: Client Storage & Interceptor -->
  <g transform="translate(560, 100)">
    <rect width="180" height="340" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <rect width="180" height="35" rx="8" fill="#faf5ff" />
    <text x="15" y="23" font-size="11" font-weight="700" fill="#6b21a8">3. SPA SESSION</text>

    <g transform="translate(15, 55)" font-size="10">
      <rect width="150" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="10" y="20" font-weight="600" fill="#334155">Secure Storage</text>
      <text x="10" y="36" fill="#64748b">Zustand memory store</text>
      <text x="10" y="50" fill="#64748b">+ HttpOnly Cookie</text>

      <rect y="80" width="150" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="10" y="100" font-weight="600" fill="#334155">Axios Interceptor</text>
      <text x="10" y="116" font-size="8.5" fill="#64748b">Injects Header:</text>
      <text x="10" y="130" font-size="8.5" fill="#64748b">`Authorization: Bearer`</text>
      <text x="10" y="142" font-size="8.5" fill="#64748b">`X-Branch-ID: 2`</text>

      <rect y="165" width="150" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="10" y="185" font-weight="600" fill="#334155">Auto-Logout</text>
      <text x="10" y="200" fill="#64748b">On 401 Unauthorized</text>
      <text x="10" y="214" fill="#64748b">Clears token &amp; redirects</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 745 270 L 785 270" stroke="#7e22ce" stroke-width="2" />
  <polygon points="785,266 793,270 785,274" fill="#7e22ce" />

  <!-- 4: Backend Middleware Guard -->
  <g transform="translate(795, 100)">
    <rect width="165" height="340" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <rect width="165" height="35" rx="8" fill="#eff6ff" />
    <text x="15" y="23" font-size="11" font-weight="700" fill="#1e40af">4. API GUARD</text>

    <g transform="translate(12, 55)" font-size="9.5">
      <rect width="140" height="70" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="10" y="20" font-weight="600" fill="#166534">Blacklist Check</text>
      <text x="10" y="35" fill="#15803d">Redis key lookup</text>
      <text x="10" y="49" fill="#15803d">blacklist:{token_jti}</text>
      <text x="10" y="63" fill="#15803d">Fast O(1) rejection</text>

      <rect y="85" width="140" height="75" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="10" y="105" font-weight="600" fill="#1e40af">Context Binding</text>
      <text x="10" y="120" fill="#3b82f6">c.Set("UserID", id)</text>
      <text x="10" y="134" fill="#3b82f6">c.Set("CompanyID", cid)</text>
      <text x="10" y="148" fill="#3b82f6">c.Set("BranchID", bid)</text>

      <rect y="175" width="140" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="10" y="195" font-weight="600" fill="#334155">Permission Check</text>
      <text x="10" y="210" fill="#64748b">RequirePermission()</text>
      <text x="10" y="224" fill="#64748b">Passes to handler</text>
    </g>
  </g>
</svg>