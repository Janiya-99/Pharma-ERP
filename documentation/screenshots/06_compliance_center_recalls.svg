  </g>

  <!-- Main Canvas -->
  <rect x="235" y="55" width="750" height="530" rx="10" fill="#ffffff" />
  <text x="260" y="95" font-size="18" font-weight="700" fill="#0f172a">Batch Quarantine &amp; Statutory Recall Console</text>
  <text x="260" y="115" font-size="12" fill="#64748b">Rapid isolation of defective drug lots, customer notification list, and stock quarantine enforcement</text>

  <!-- Form & Table -->
  <g transform="translate(260, 140)">
