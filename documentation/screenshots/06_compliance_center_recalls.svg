    <text x="20" y="45" font-size="10" fill="#9f1239">Triggering a batch quarantine instantly prevents all dispatch officers from selecting or billing this batch.</text>
    <text x="20" y="65" font-size="10" font-weight="600" fill="#be123c">Automated Customer Recall Notification generated for all invoices issued within the batch validity period.</text>

    <!-- Table -->
    <g transform="translate(0, 105)">
      <rect width="700" height="315" rx="8" fill="#ffffff" stroke="#e2e8f0" />
      <rect width="700" height="32" rx="8" fill="#f1f5f9" />
      <text x="15" y="21" font-size="10" font-weight="700" fill="#475569">RECALL ID</text>
      <text x="110" y="21" font-size="10" font-weight="700" fill="#475569">BATCH NO</text>
      <text x="220" y="21" font-size="10" font-weight="700" fill="#475569">PRODUCT</text>
      <text x="360" y="21" font-size="10" font-weight="700" fill="#475569">SEVERITY</text>
      <text x="470" y="21" font-size="10" font-weight="700" fill="#475569">QUARANTINED</text>
      <text x="590" y="21" font-size="10" font-weight="700" fill="#475569">AFFECTED INVS</text>

      <g transform="translate(0, 45)" font-size="11">
        <text x="15" y="18" font-weight="700" fill="#0284c7">RCL-2026-001</text>
        <text x="110" y="18" font-weight="600" fill="#0f172a">LOT-Q-202611</text>
        <text x="220" y="18" font-weight="600" fill="#0f172a">Ceftriaxone 1g</text>
        <rect x="360" y="4" width="80" height="20" rx="4" fill="#fee2e2" />
        <text x="368" y="18" font-size="10" font-weight="700" fill="#dc2626">CLASS I (NMRA)</text>
        <text x="470" y="18" font-weight="600" fill="#be123c">800 Vials</text>
        <text x="590" y="18" font-weight="600" fill="#0f172a">12 Invoices</text>
