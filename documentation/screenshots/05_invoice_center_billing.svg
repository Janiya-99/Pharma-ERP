<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Mock Browser Window -->
  <rect width="1000" height="600" fill="#0f172a" />
  
  <!-- Browser Chrome Header -->
  <rect width="1000" height="42" fill="#1e293b" />
  <circle cx="20" cy="21" r="6" fill="#ef4444" />
  <circle cx="38" cy="21" r="6" fill="#eab308" />
  <circle cx="56" cy="21" r="6" fill="#22c55e" />
  <rect x="120" y="8" width="500" height="26" rx="6" fill="#0f172a" />
  <text x="140" y="25" font-size="12" fill="#94a3b8">https://erp.pixandco.lk/invoice-center/sales-invoices/new</text>

  <!-- Sidebar -->
  <rect x="0" y="42" width="220" height="558" fill="#1e293b" />
  <text x="24" y="80" font-size="15" font-weight="700" fill="#ffffff">PHARMA ERP</text>
  <text x="24" y="98" font-size="10" fill="#0ea5e9">QA20261015 PHARMA (HQ)</text>

  <g font-size="12" fill="#94a3b8" transform="translate(24, 130)">
    <text y="0" fill="#64748b" font-size="10" font-weight="700">MODULES</text>
    <text y="30" fill="#94a3b8">⊞  Control Center</text>
    <text y="65" fill="#94a3b8">💳 Finance</text>
    <text y="100" fill="#94a3b8">📦 Inventory (FEFO)</text>
    <rect x="-10" y="120" width="190" height="32" rx="6" fill="#0284c7" />
    <text y="141" fill="#ffffff" font-weight="600">🧾 Invoice Center</text>
    <text y="180" fill="#94a3b8">🛡️ Compliance Center</text>
  </g>

  <!-- Main Canvas -->
  <rect x="235" y="55" width="750" height="530" rx="10" fill="#ffffff" />
  
  <!-- Content Header -->
  <text x="260" y="95" font-size="18" font-weight="700" fill="#0f172a">Create Sales Invoice</text>
  <text x="260" y="115" font-size="12" fill="#64748b">Issue tax-compliant pharmaceutical sales invoice with automatic FEFO batch allocation</text>

  <!-- Form Fields -->
  <g transform="translate(260, 140)">
    <!-- Customer Select -->
    <rect width="220" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="12" y="16" font-size="9" fill="#64748b">CUSTOMER</text>
    <text x="12" y="32" font-size="12" font-weight="600" fill="#0f172a">Lanka Pharmacy (Pvt) Ltd</text>

    <!-- Branch Select -->
    <rect x="240" width="220" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="252" y="16" font-size="9" fill="#64748b">DISPATCH BRANCH</text>
    <text x="252" y="32" font-size="12" font-weight="600" fill="#0f172a">Colombo Central Depot (QA_CMB)</text>

    <!-- Payment Terms -->
    <rect x="480" width="220" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="492" y="16" font-size="9" fill="#64748b">PAYMENT TERMS</text>
    <text x="492" y="32" font-size="12" font-weight="600" fill="#0f172a">Credit 30 Days (Limit: LKR 500k)</text>
  </g>

  <!-- Line Items Table -->
  <g transform="translate(260, 205)">
    <rect width="700" height="220" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <rect width="700" height="32" rx="8" fill="#f1f5f9" />
    <text x="15" y="21" font-size="10" font-weight="700" fill="#475569">PRODUCT &amp; DOSAGE</text>
    <text x="220" y="21" font-size="10" font-weight="700" fill="#475569">ALLOCATED BATCH (FEFO)</text>
    <text x="390" y="21" font-size="10" font-weight="700" fill="#475569">EXPIRY</text>
    <text x="460" y="21" font-size="10" font-weight="700" fill="#475569">QTY</text>
    <text x="510" y="21" font-size="10" font-weight="700" fill="#475569">UNIT (LKR)</text>
    <text x="600" y="21" font-size="10" font-weight="700" fill="#475569">TOTAL (LKR)</text>

    <!-- Row 1 -->
    <text x="15" y="58" font-size="11" font-weight="600" fill="#0f172a">Amoxicillin 500mg Caps</text>
    <rect x="220" y="44" width="130" height="20" rx="4" fill="#dcfce7" />
    <text x="226" y="58" font-size="10" font-weight="600" fill="#166534">LOT-B-202706 (FEFO #1)</text>
    <text x="390" y="58" font-size="11" fill="#475569">2027-06-30</text>
    <text x="460" y="58" font-size="11" font-weight="600" fill="#0f172a">500</text>
    <text x="510" y="58" font-size="11" fill="#475569">85.00</text>
    <text x="600" y="58" font-size="11" font-weight="700" fill="#0f172a">42,500.00</text>

    <!-- Row 2 -->
    <text x="15" y="98" font-size="11" font-weight="600" fill="#0f172a">Paracetamol 500mg Tabs</text>
    <rect x="220" y="84" width="130" height="20" rx="4" fill="#dcfce7" />
    <text x="226" y="98" font-size="10" font-weight="600" fill="#166534">LOT-A-202801 (FEFO #1)</text>
    <text x="390" y="98" font-size="11" fill="#475569">2028-01-15</text>
    <text x="460" y="98" font-size="11" font-weight="600" fill="#0f172a">2000</text>
    <text x="510" y="98" font-size="11" fill="#475569">2.50</text>
    <text x="600" y="98" font-size="11" font-weight="700" fill="#0f172a">5,000.00</text>
  </g>

  <!-- Summary Box (Taxes) -->
  <g transform="translate(680, 440)">
    <rect width="280" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="15" y="25" font-size="11" fill="#64748b">Subtotal:</text>
    <text x="260" y="25" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">LKR 47,500.00</text>

    <text x="15" y="48" font-size="11" fill="#64748b">SSCL (2.5% Statutory):</text>
    <text x="260" y="48" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">LKR 1,187.50</text>

    <text x="15" y="71" font-size="11" fill="#64748b">VAT Liable 18%:</text>
    <text x="260" y="71" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">LKR 8,763.75</text>

    <line x1="15" y1="85" x2="265" y2="85" stroke="#cbd5e1" stroke-width="1" />

    <text x="15" y="110" font-size="13" font-weight="700" fill="#0284c7">Grand Total:</text>
    <text x="260" y="110" font-size="14" font-weight="800" fill="#0284c7" text-anchor="end">LKR 57,451.25</text>
  </g>

  <!-- Action Buttons -->
  <g transform="translate(260, 520)">
    <rect width="180" height="42" rx="6" fill="#0284c7" />
    <text x="35" y="26" font-size="12" font-weight="700" fill="#ffffff">POST INVOICE &amp; GL</text>

    <rect x="200" width="140" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="232" y="26" font-size="12" font-weight="600" fill="#475569">Save as Draft</text>
  </g>
</svg>