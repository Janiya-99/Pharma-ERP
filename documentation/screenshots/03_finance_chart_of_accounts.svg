<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1000" height="600" fill="#0f172a" />
  <rect width="1000" height="42" fill="#1e293b" />
  <circle cx="20" cy="21" r="6" fill="#ef4444" /><circle cx="38" cy="21" r="6" fill="#eab308" /><circle cx="56" cy="21" r="6" fill="#22c55e" />
  <rect x="120" y="8" width="500" height="26" rx="6" fill="#0f172a" />
  <text x="140" y="25" font-size="12" fill="#94a3b8">https://erp.pixandco.lk/finance/chart-of-accounts</text>

  <rect x="0" y="42" width="220" height="558" fill="#1e293b" />
  <text x="24" y="80" font-size="15" font-weight="700" fill="#ffffff">PHARMA ERP</text>
  <text x="24" y="98" font-size="10" fill="#0ea5e9">FINANCE MODULE</text>

  <g font-size="12" fill="#94a3b8" transform="translate(24, 130)">
    <rect x="-10" y="10" width="190" height="32" rx="6" fill="#0284c7" />
    <text y="31" fill="#ffffff" font-weight="600">📊 Chart of Accounts</text>
    <text y="70" fill="#94a3b8">📖 General Ledger</text>
    <text y="105" fill="#94a3b8">✍️ Journal Entries</text>
    <text y="140" fill="#94a3b8">💸 Payment Vouchers</text>
    <text y="175" fill="#94a3b8">📈 Financial Reports</text>
  </g>

  <!-- Main Canvas -->
  <rect x="235" y="55" width="750" height="530" rx="10" fill="#ffffff" />
  <text x="260" y="95" font-size="18" font-weight="700" fill="#0f172a">Chart of Accounts Hierarchy</text>
  <text x="260" y="115" font-size="12" fill="#64748b">Statutory pharmaceutical double-entry ledger tree, classifications and current balances</text>

  <!-- Tree Table -->
  <g transform="translate(260, 140)">
    <rect width="700" height="420" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="700" height="32" rx="8" fill="#f1f5f9" />
    <text x="15" y="21" font-size="10" font-weight="700" fill="#475569">ACCOUNT CODE</text>
    <text x="140" y="21" font-size="10" font-weight="700" fill="#475569">ACCOUNT TITLE</text>
    <text x="360" y="21" font-size="10" font-weight="700" fill="#475569">TYPE</text>
    <text x="480" y="21" font-size="10" font-weight="700" fill="#475569">CURRENCY</text>
    <text x="600" y="21" font-size="10" font-weight="700" fill="#475569">BALANCE (LKR)</text>

    <g transform="translate(0, 45)" font-size="11">
      <text x="15" y="15" font-weight="700" fill="#1e40af">1000</text>
      <text x="140" y="15" font-weight="700" fill="#0f172a">Current Assets</text>
      <text x="360" y="15" fill="#64748b">Header</text>
      <text x="480" y="15" fill="#64748b">LKR</text>
      <text x="600" y="15" font-weight="700" fill="#0f172a">14,250,800.00</text>

      <text x="25" y="45" font-weight="600" fill="#0284c7">1010</text>
      <text x="155" y="45" font-weight="600" fill="#0f172a">Bank &amp; Cash Accounts</text>
      <text x="360" y="45" fill="#64748b">Asset</text>
      <text x="480" y="45" fill="#64748b">LKR</text>
      <text x="600" y="45" font-weight="600" fill="#0f172a">4,120,500.00</text>

      <text x="25" y="75" font-weight="600" fill="#0284c7">1100</text>
      <text x="155" y="75" font-weight="600" fill="#0f172a">Accounts Receivable (Trade)</text>
      <text x="360" y="75" fill="#64748b">Asset</text>
      <text x="480" y="75" fill="#64748b">LKR</text>
      <text x="600" y="75" font-weight="600" fill="#0f172a">5,820,300.00</text>

      <text x="25" y="105" font-weight="600" fill="#0284c7">1200</text>
      <text x="155" y="105" font-weight="600" fill="#0f172a">Pharmaceutical Inventory Asset</text>
      <text x="360" y="105" fill="#64748b">Asset</text>
      <text x="480" y="105" fill="#64748b">LKR</text>
      <text x="600" y="105" font-weight="600" fill="#0f172a">4,310,000.00</text>

      <text x="15" y="145" font-weight="700" fill="#92400e">2000</text>
      <text x="140" y="145" font-weight="700" fill="#0f172a">Current Liabilities</text>
      <text x="360" y="145" fill="#64748b">Header</text>
      <text x="480" y="145" fill="#64748b">LKR</text>
      <text x="600" y="145" font-weight="700" fill="#0f172a">3,140,200.00</text>
