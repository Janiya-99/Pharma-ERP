<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="1000" height="600" fill="#0f172a" />
  <rect width="1000" height="42" fill="#1e293b" />
  <circle cx="20" cy="21" r="6" fill="#ef4444" /><circle cx="38" cy="21" r="6" fill="#eab308" /><circle cx="56" cy="21" r="6" fill="#22c55e" />
  <rect x="120" y="8" width="500" height="26" rx="6" fill="#0f172a" />
  <text x="140" y="25" font-size="12" fill="#94a3b8">https://erp.pixandco.lk/inventory/product-batches</text>

  <rect x="0" y="42" width="220" height="558" fill="#1e293b" />
  <text x="24" y="80" font-size="15" font-weight="700" fill="#ffffff">PHARMA ERP</text>
  <text x="24" y="98" font-size="10" fill="#0ea5e9">INVENTORY (FEFO)</text>

  <g font-size="12" fill="#94a3b8" transform="translate(24, 130)">
    <rect x="-10" y="10" width="190" height="32" rx="6" fill="#0284c7" />
    <text y="31" fill="#ffffff" font-weight="600">📦 Batches &amp; FEFO Expiry</text>
    <text y="70" fill="#94a3b8">📥 Goods Receipt Notes</text>
    <text y="105" fill="#94a3b8">🏢 Warehouses &amp; Bins</text>
    <text y="140" fill="#94a3b8">🔄 Stock Transfers</text>
    <text y="175" fill="#94a3b8">📜 Stock Ledger Audit</text>
  </g>

  <!-- Main Canvas -->
  <rect x="235" y="55" width="750" height="530" rx="10" fill="#ffffff" />
  <text x="260" y="95" font-size="18" font-weight="700" fill="#0f172a">Batch Management &amp; FEFO Dispatch Queue</text>
  <text x="260" y="115" font-size="12" fill="#64748b">Pharmaceutical expiry index, automated FEFO ordering, quarantine and batch tracking</text>

  <!-- Table -->
  <g transform="translate(260, 140)">
    <rect width="700" height="420" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="700" height="32" rx="8" fill="#f1f5f9" />
    <text x="15" y="21" font-size="10" font-weight="700" fill="#475569">BATCH NO</text>
    <text x="130" y="21" font-size="10" font-weight="700" fill="#475569">PRODUCT NAME</text>
    <text x="310" y="21" font-size="10" font-weight="700" fill="#475569">EXPIRY DATE</text>
    <text x="420" y="21" font-size="10" font-weight="700" fill="#475569">FEFO PRIORITY</text>
    <text x="530" y="21" font-size="10" font-weight="700" fill="#475569">STOCK</text>
    <text x="610" y="21" font-size="10" font-weight="700" fill="#475569">STATUS</text>

    <g transform="translate(0, 45)" font-size="11">
      <!-- Batch 1 -->
      <text x="15" y="18" font-weight="700" fill="#0f172a">LOT-B-202706</text>
      <text x="130" y="18" font-weight="600" fill="#0f172a">Amoxicillin 500mg</text>
      <text x="310" y="18" fill="#b45309" font-weight="600">2027-06-30</text>
      <rect x="420" y="4" width="90" height="20" rx="4" fill="#dcfce7" />
      <text x="428" y="18" font-size="10" font-weight="700" fill="#15803d">#1 (PRIORITY)</text>
      <text x="530" y="18" font-weight="600" fill="#0f172a">1,500</text>
      <rect x="610" y="4" width="60" height="20" rx="4" fill="#dcfce7" />
      <text x="620" y="18" font-size="10" font-weight="600" fill="#15803d">ACTIVE</text>

      <!-- Batch 2 -->
      <text x="15" y="58" font-weight="700" fill="#0f172a">LOT-A-202712</text>
      <text x="130" y="58" font-weight="600" fill="#0f172a">Amoxicillin 500mg</text>
      <text x="310" y="58" fill="#475569">2027-12-31</text>
      <rect x="420" y="44" width="90" height="20" rx="4" fill="#f1f5f9" />
      <text x="428" y="58" font-size="10" font-weight="600" fill="#475569">#2 QUEUE</text>
      <text x="530" y="58" font-weight="600" fill="#0f172a">3,000</text>
      <rect x="610" y="44" width="60" height="20" rx="4" fill="#dcfce7" />
      <text x="620" y="58" font-size="10" font-weight="600" fill="#15803d">ACTIVE</text>

      <!-- Batch 3 (Quarantined) -->
      <text x="15" y="98" font-weight="700" fill="#e11d48">LOT-Q-202611</text>
      <text x="130" y="98" font-weight="600" fill="#0f172a">Ceftriaxone 1g Inj</text>
      <text x="310" y="98" fill="#e11d48">2026-11-15</text>
      <rect x="420" y="84" width="90" height="20" rx="4" fill="#ffe4e6" />
      <text x="428" y="98" font-size="10" font-weight="700" fill="#be123c">BLOCKED</text>
      <text x="530" y="98" font-weight="600" fill="#0f172a">800</text>
      <rect x="610" y="84" width="60" height="20" rx="4" fill="#fee2e2" />
      <text x="620" y="98" font-size="10" font-weight="700" fill="#dc2626">HOLD</text>
    </g>
  </g>
</svg>