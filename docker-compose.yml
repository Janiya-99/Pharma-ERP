services:
  # 1. Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: pharma-erp-frontend

    ports:
      - "127.0.0.1:8081:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - pharma-network


  # 2. Go Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pharma-erp-backend

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      APP_ENV: production
      APP_PORT: 8080

      # Shared MySQL
      PLATFORM_DB_HOST: shared-mysql
      PLATFORM_DB_PORT: 3306
      PLATFORM_DB_USER: pharma_erp_user
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      PLATFORM_DB_NAME: erp_phrma

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

    depends_on:
      - redis

    restart: unless-stopped

    networks:
      - pharma-network
      - shared-services


  # 3. Redis - ERP specific
  redis:
    image: redis:7-alpine

    container_name: pharma-erp-redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    networks:
      - pharma-network


volumes:
  redis_data:


networks:
  pharma-network:
    driver: bridge

  shared-services:
    external: true